<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08111e">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>TABELA AI V11.1</title>
  <link rel="manifest" href="./manifest.webmanifest?b=11.1.0">
</head>
<body style="margin:0;background:#08111e;color:#eef5ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif">
  <main style="max-width:760px;margin:auto;padding:32px 18px">
    <h1 style="margin:0 0 8px">TABELA AI V11.1</h1>
    <p style="color:#93a6bf">UNIVERSAL FIELD 11.1.0 yükleniyor…</p>
    <p id="fallback" style="display:none;color:#ffdc72">Ana uygulama yüklenemedi. <a style="color:#59dba8" href="../v11/?build=11.1.0">V11 çekirdeğini aç</a></p>
  </main>
  <script>
  (async()=>{
    const stamp=Date.now();
    async function getCore(){
      try{
        const r=await fetch('../v11/index.html?core=11.1.0&t='+stamp,{cache:'no-store'});
        if(r.ok)return await r.text();
      }catch(e){}
      try{
        const r=await fetch('../v11/index.html',{cache:'reload'});
        if(r.ok)return await r.text();
      }catch(e){}
      throw new Error('core_load_failed');
    }
    try{
      let html=await getCore();
      html=html.replace('<head>','<head><base href="../v11/">');
      html=html.replaceAll('<title>TABELA AI V11</title>','<title>TABELA AI V11.1</title>');
      html=html.replaceAll('TABELA AI <span class="ver">V11</span>','TABELA AI <span class="ver">V11.1</span>');
      html=html.replaceAll('HARDENED FIELD 11.0.0','UNIVERSAL FIELD 11.1.0');
      html=html.replaceAll('./manifest.webmanifest?b=11.0.0','../v11_1/manifest.webmanifest?b=11.1.0');
      html=html.replaceAll('./service-worker.js','../v11_1/service-worker.js');
      html=html.replaceAll('tabela_ai_v11.csv','tabela_ai_v11_1.csv');
      document.open();document.write(html);document.close();
    }catch(error){
      document.getElementById('fallback').style.display='block';
      console.error(error);
    }
  })();
  </script>
</body>
</html>
