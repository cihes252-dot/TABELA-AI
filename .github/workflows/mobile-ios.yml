name: Build TABELA AI iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/ios/**'
      - 'app/v11/**'
      - '.github/workflows/mobile-ios.yml'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project native/ios/TabelaAIMobile/TabelaAI.xcodeproj
          -scheme TabelaAI
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/SimulatorDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mobile/ios
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'TabelaAI.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/mobile/ios/TabelaAI-ios-simulator.zip
          shasum -a 256 dist/mobile/ios/TabelaAI-ios-simulator.zip > dist/mobile/ios/TabelaAI-ios-simulator.sha256

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-ios-simulator
          path: |
            dist/mobile/ios/TabelaAI-ios-simulator.zip
            dist/mobile/ios/TabelaAI-ios-simulator.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned iPhone device app
        run: >-
          xcodebuild
          -project native/ios/TabelaAIMobile/TabelaAI.xcodeproj
          -scheme TabelaAI
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DeviceDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mobile/ios
          APP_PATH="$(find build/DeviceDerivedData/Build/Products/Debug-iphoneos -maxdepth 1 -name 'TabelaAI.app' -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/mobile/ios/TabelaAI-ios-device-unsigned.zip
          shasum -a 256 dist/mobile/ios/TabelaAI-ios-device-unsigned.zip > dist/mobile/ios/TabelaAI-ios-device-unsigned.sha256

      - name: Upload unsigned iPhone device artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-ios-device-unsigned
          path: |
            dist/mobile/ios/TabelaAI-ios-device-unsigned.zip
            dist/mobile/ios/TabelaAI-ios-device-unsigned.sha256
          if-no-files-found: error
          retention-days: 30
