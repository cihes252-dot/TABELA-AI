name: Build TABELA AI iOS

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/ios/**'
      - 'app/v11/**'
      - 'app/v11_1/**'
      - '.github/workflows/mobile-ios.yml'

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run pure metric geometry self-test
        shell: bash
        run: |
          set -euo pipefail
          xcrun swiftc native/ios/TabelaMetricEngine.swift native/ios/TabelaMetricSelfTestMain.swift -o /tmp/tabela-metric-selftest
          /tmp/tabela-metric-selftest

      - name: Analyze iOS Simulator target
        run: >-
          xcodebuild
          -project native/ios/TabelaAIMobile/TabelaAI.xcodeproj
          -scheme TabelaAI
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/AnalyzeDerivedData
          CODE_SIGNING_ALLOWED=NO
          analyze

      - name: Build iOS Simulator app
        run: >-
          xcodebuild
          -project native/ios/TabelaAIMobile/TabelaAI.xcodeproj
          -scheme TabelaAI
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/SimulatorDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify and package iOS Simulator app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mobile/ios
          APP_PATH="$(find build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name 'TabelaAI.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/WebApp/v11_1/index.html"
          test -f "$APP_PATH/WebApp/v11_1/resilience.js"
          test -f "$APP_PATH/WebApp/v11/ocr-ensemble.js"
          test -f "$APP_PATH/WebApp/v11/storage-engine.js"
          test -f "$APP_PATH/WebApp/v11/measurement-engine.js"
          grep -q '11.1.2' "$APP_PATH/WebApp/v11_1/index.html"
          grep -q '11.1.2-resilient-ocr' "$APP_PATH/WebApp/v11/ocr-ensemble.js"
          grep -q '11.1.2-indexeddb-atomic' "$APP_PATH/WebApp/v11/storage-engine.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "11.1.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "4"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/mobile/ios/TabelaAI-ios-simulator-11.1.2.zip
          (cd dist/mobile/ios && shasum -a 256 TabelaAI-ios-simulator-11.1.2.zip > TabelaAI-ios-simulator-11.1.2.sha256)
          (cd dist/mobile/ios && shasum -a 256 -c TabelaAI-ios-simulator-11.1.2.sha256)

      - name: Upload iOS Simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-ios-simulator-11-1-2
          path: |
            dist/mobile/ios/TabelaAI-ios-simulator-11.1.2.zip
            dist/mobile/ios/TabelaAI-ios-simulator-11.1.2.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Build unsigned iPhone device app
        run: >-
          xcodebuild
          -project native/ios/TabelaAIMobile/TabelaAI.xcodeproj
          -scheme TabelaAI
          -configuration Debug
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DeviceDerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify and package unsigned iPhone device app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mobile/ios
          APP_PATH="$(find build/DeviceDerivedData/Build/Products/Debug-iphoneos -maxdepth 1 -name 'TabelaAI.app' -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/WebApp/v11_1/index.html"
          test -f "$APP_PATH/WebApp/v11_1/resilience.js"
          test -f "$APP_PATH/WebApp/v11/ocr-ensemble.js"
          test -f "$APP_PATH/WebApp/v11/storage-engine.js"
          test -f "$APP_PATH/WebApp/v11/measurement-engine.js"
          grep -q '11.1.2' "$APP_PATH/WebApp/v11_1/index.html"
          grep -q '11.1.2-resilient-ocr' "$APP_PATH/WebApp/v11/ocr-ensemble.js"
          grep -q '11.1.2-indexeddb-atomic' "$APP_PATH/WebApp/v11/storage-engine.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "11.1.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "4"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" dist/mobile/ios/TabelaAI-ios-device-unsigned-11.1.2.zip
          (cd dist/mobile/ios && shasum -a 256 TabelaAI-ios-device-unsigned-11.1.2.zip > TabelaAI-ios-device-unsigned-11.1.2.sha256)
          (cd dist/mobile/ios && shasum -a 256 -c TabelaAI-ios-device-unsigned-11.1.2.sha256)

      - name: Upload unsigned iPhone device artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-ios-device-unsigned-11-1-2
          path: |
            dist/mobile/ios/TabelaAI-ios-device-unsigned-11.1.2.zip
            dist/mobile/ios/TabelaAI-ios-device-unsigned-11.1.2.sha256
          if-no-files-found: error
          retention-days: 30
