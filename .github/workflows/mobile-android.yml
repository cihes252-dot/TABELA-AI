name: Build TABELA AI Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/TabelaAIMobile/**'
      - 'app/v11/**'
      - 'app/v11_1/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run metric geometry unit tests
        run: gradle -p native/android/TabelaAIMobile :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle -p native/android/TabelaAIMobile :app:lintDebug --stacktrace

      - name: Build debug APK
        run: gradle -p native/android/TabelaAIMobile :app:assembleDebug --stacktrace

      - name: Verify bundled offline field app
        shell: bash
        run: |
          set -euo pipefail
          APK=native/android/TabelaAIMobile/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/v11_1/index.html'
          unzip -l "$APK" | grep -q 'assets/v11/ocr-ensemble.js'
          unzip -l "$APK" | grep -q 'assets/v11/measurement-engine.js'
          unzip -p "$APK" assets/v11_1/index.html | grep -q '11.1.1'
          unzip -p "$APK" assets/v11/ocr-ensemble.js | grep -q '11.1-independent-verify'

      - name: Package APK with checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mobile/android
          cp native/android/TabelaAIMobile/app/build/outputs/apk/debug/app-debug.apk dist/mobile/android/TabelaAI-Android-11.1.1.apk
          (cd dist/mobile/android && sha256sum TabelaAI-Android-11.1.1.apk > TabelaAI-Android-11.1.1.sha256)
          (cd dist/mobile/android && sha256sum -c TabelaAI-Android-11.1.1.sha256)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-android-universal-11-1-1
          path: |
            dist/mobile/android/TabelaAI-Android-11.1.1.apk
            dist/mobile/android/TabelaAI-Android-11.1.1.sha256
          if-no-files-found: error
          retention-days: 30
