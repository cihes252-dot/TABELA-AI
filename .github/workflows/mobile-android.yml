name: Build TABELA AI Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/android/TabelaAIMobile/**'
      - 'app/v11/**'
      - '.github/workflows/mobile-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle -p native/android/TabelaAIMobile :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-android-debug
          path: native/android/TabelaAIMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
