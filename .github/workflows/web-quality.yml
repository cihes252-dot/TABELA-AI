name: Test TABELA AI Web Quality

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app/v12/**'
      - 'app/v11/measurement-engine.js'
      - 'app/v11_2/fast-ocr-engine.js'
      - 'tests/web-measurement-smoke.mjs'
      - 'tests/web-fast-ocr-selection.mjs'
      - 'tests/web-v12-clean-smoke.mjs'
      - '.github/workflows/web-quality.yml'

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        run: |
          node --check app/v12/app.js
          node --check app/v12/service-worker.js
          node --check app/v11/measurement-engine.js
          node --check app/v11_2/fast-ocr-engine.js
      - name: Run measurement trust smoke tests
        run: node tests/web-measurement-smoke.mjs
      - name: Run dominant sign OCR selection test
        run: node tests/web-fast-ocr-selection.mjs
      - name: Run V12 clean field smoke test
        run: node tests/web-v12-clean-smoke.mjs
      - name: Verify active V12 release
        run: |
          grep -q 'app/v12' index.html
          grep -q '12.0.0' index.html
          grep -q 'Clean Field' app/v12/index.html
          grep -q 'TabelaFastOCR.run' app/v12/app.js
          grep -q 'Pikselden metre üretilmez' app/v12/app.js
          ! grep -q 'camera-clean-ui' app/v12/index.html
          ! grep -q 'manual-ocr-roi' app/v12/index.html
          ! grep -q 'webxr-measurement' app/v12/index.html