name: Test TABELA AI Web Quality

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app/v10/**'
      - 'app/v11/**'
      - 'app/v11_1/**'
      - 'tests/web-measurement-smoke.mjs'
      - 'tests/web-loader-smoke.mjs'
      - '.github/workflows/web-quality.yml'

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/v11/measurement-engine.js
          node --check app/v11/quality-engine.js
          node --check app/v11/multiframe-engine.js
          node --check app/v11/segmentation-engine.js
          node --check app/v11/perspective-engine.js
          node --check app/v11/ocr-ensemble.js
          node --check app/v11/fingerprint-engine.js
          node --check app/v11/duplicate-engine.js
          node --check app/v11/orientation-engine.js
          node --check app/v11/address-engine.js
          node --check app/v11/material-engine.js
          node --check app/v11/storage-engine.js
          node --check app/v11_1/resilience.js
          node --check app/v11_1/field-hardening.js
          node --check app/v11_1/service-worker.js
          node --check app/v10/shape-engine.js
          node --check app/v10/ocr-engine.js

      - name: Run measurement trust smoke tests
        run: node tests/web-measurement-smoke.mjs

      - name: Run V11.1 loader smoke test
        run: node tests/web-loader-smoke.mjs

      - name: Verify V11.1.2 field release contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TABELA AI V11.1' app/v11_1/index.html
          grep -q 'UNIVERSAL FIELD 11.1.2' app/v11_1/index.html
          grep -Fq "serviceWorker.register('./service-worker.js?b=11.1.2'" app/v11_1/index.html
          grep -q 'resilience.js?b=11.1.2' app/v11_1/index.html
          grep -q 'field-hardening.js?b=11.1.2' app/v11_1/index.html
          grep -q 'nativeMode' app/v11_1/index.html
          grep -q 'app/v11_1' index.html
          grep -q '11.1.2' app/v11_1/manifest.webmanifest
          grep -q 'field-hardening.js' app/v11_1/service-worker.js
          grep -q 'tabela-ai-v11-1-11.1.2' app/v11_1/service-worker.js
          grep -q '11.1.2-resilient-ocr' app/v11/ocr-ensemble.js
          grep -q 'manual-required-no-ocr-engine' app/v11/ocr-ensemble.js
          grep -q 'native+web-independent' app/v11/ocr-ensemble.js
          grep -q '11.1.2-indexeddb-atomic' app/v11/storage-engine.js
          grep -q 'requestPersistentStorage' app/v11/storage-engine.js
          grep -q "version:'11.1.2'" app/v11_1/resilience.js
          grep -q "11.1.2-field-hardened" app/v11_1/field-hardening.js
          grep -q 'boundaryDetected' app/v10/shape-engine.js
          grep -q '11.1.2-throttled-field' app/v11/address-engine.js
