name: Test TABELA AI Web Quality

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'app/v10/**'
      - 'app/v11/**'
      - 'app/v11_1/**'
      - 'app/v11_2/**'
      - 'tests/web-measurement-smoke.mjs'
      - 'tests/web-loader-smoke.mjs'
      - 'tests/web-fast-field-smoke.mjs'
      - 'tests/web-fast-ocr-selection.mjs'
      - 'tests/web-webxr-smoke.mjs'
      - '.github/workflows/web-quality.yml'

jobs:
  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in app/v11/measurement-engine.js app/v11/quality-engine.js app/v11/multiframe-engine.js app/v11/segmentation-engine.js app/v11/perspective-engine.js app/v11/ocr-ensemble.js app/v11/fingerprint-engine.js app/v11/duplicate-engine.js app/v11/orientation-engine.js app/v11/address-engine.js app/v11/material-engine.js app/v11/storage-engine.js app/v11_1/resilience.js app/v11_1/field-hardening.js app/v11_1/service-worker.js app/v11_2/sign-taxonomy.js app/v11_2/fast-ocr-engine.js app/v11_2/field-accuracy-fix.js app/v11_2/webxr-measurement.js app/v11_2/fast-field.js app/v11_2/field-diagnostics.js app/v11_2/camera-clean-ui.js app/v11_2/field-runtime-fix.js app/v11_2/service-worker.js app/v10/shape-engine.js app/v10/ocr-engine.js; do node --check "$f"; done
      - name: Run measurement trust smoke tests
        run: node tests/web-measurement-smoke.mjs
      - name: Run V11.1 loader smoke test
        run: node tests/web-loader-smoke.mjs
      - name: Run V11.2 FAST FIELD smoke test
        run: node tests/web-fast-field-smoke.mjs
      - name: Run dominant sign OCR selection test
        run: node tests/web-fast-ocr-selection.mjs
      - name: Run Android-only WebXR 3D measurement smoke test
        run: node tests/web-webxr-smoke.mjs
      - name: Verify active FAST FIELD release
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app/v11_2' index.html
          grep -q '11.2.10' index.html
          grep -q 'FAST FIELD 11.2.10' app/v11_2/index.html
          grep -q 'fast-field.js?b=11.2.10' app/v11_2/index.html
          grep -q 'fast-ocr-engine.js?b=11.2.10' app/v11_2/index.html
          grep -q 'field-accuracy-fix.js?b=11.2.10' app/v11_2/index.html
          grep -q 'sign-taxonomy.js?b=11.2.10' app/v11_2/index.html
          grep -q 'webxr-measurement.js?b=11.2.10' app/v11_2/index.html
          grep -q 'field-diagnostics.js?b=11.2.10' app/v11_2/index.html
          grep -q '11.2.10' app/v11_2/manifest.webmanifest
          grep -q 'tabela-ai-v11-2-11.2.10-ocr-full-roi' app/v11_2/service-worker.js
          grep -q 'TARGET_MS=3000' app/v11_2/fast-ocr-engine.js
          grep -q 'singlePass:true' app/v11_2/fast-ocr-engine.js
          grep -q 'tur+eng' app/v11_2/fast-ocr-engine.js
          grep -q 'headline-fallback-after-full-roi' app/v11_2/field-accuracy-fix.js
          grep -q '11.2.10-full-roi-first' app/v11_2/field-accuracy-fix.js
          grep -q 'KAYIT BEKLER' app/v11_2/field-runtime-fix.js
          grep -q 'stable-live-roi' app/v11_2/fast-field.js
          grep -q 'ellipseStrong' app/v10/shape-engine.js
          grep -q 'ios_webxr_disabled' app/v11_2/webxr-measurement.js
          grep -q "webxrPlatform:'android'" app/v11_2/webxr-measurement.js
          grep -q 'native-ios-arkit-lidar' app/v11_2/field-diagnostics.js
          grep -q 'web-no-metric' app/v11_2/field-diagnostics.js
          grep -q 'Pylon / direk tabelası' app/v11_2/sign-taxonomy.js
          grep -q '11.1.2-indexeddb-atomic' app/v11/storage-engine.js