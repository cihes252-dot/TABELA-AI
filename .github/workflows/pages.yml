name: Deploy TABELA AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check active JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app/v12/app.js
          node --check app/v12/service-worker.js
          node --check app/v11/measurement-engine.js
          node --check app/v11_2/fast-ocr-engine.js
      - name: Run trusted measurement smoke tests
        run: node tests/web-measurement-smoke.mjs
      - name: Run Turkish sign OCR selection tests
        run: node tests/web-fast-ocr-selection.mjs
      - name: Run V12.1 clean field smoke test
        run: node tests/web-v12-clean-smoke.mjs
      - name: Verify V12.1 clean release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'app/v12' index.html
          grep -q '12.1.0' index.html
          grep -q 'Clean Field 12.1' app/v12/index.html
          grep -q 'Canlı Kamera' app/v12/index.html
          grep -q 'Fotoğraf Yükle' app/v12/index.html
          grep -q 'fast-ocr-engine.js' app/v12/index.html
          grep -q 'measurement-engine.js' app/v12/index.html
          grep -q 'tabela-ai-v12-clean-field-12.1.0' app/v12/service-worker.js
          grep -q 'TabelaFastOCR.run' app/v12/app.js
          grep -q 'Gürültülü OCR reddedildi' app/v12/app.js
          grep -q 'interiorGain' app/v12/app.js
          grep -q 'autoMetric:true' app/v12/app.js
          grep -q 'Pikselden metre üretilmez' app/v12/app.js
          ! grep -qi 'oval.*kılavuz' app/v12/index.html
          ! grep -q 'webxr-measurement' app/v12/index.html

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4