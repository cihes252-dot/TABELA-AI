name: Deploy TABELA AI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            app/v11/measurement-engine.js \
            app/v11/quality-engine.js \
            app/v11/multiframe-engine.js \
            app/v11/segmentation-engine.js \
            app/v11/perspective-engine.js \
            app/v11/ocr-ensemble.js \
            app/v11/fingerprint-engine.js \
            app/v11/duplicate-engine.js \
            app/v11/orientation-engine.js \
            app/v11/address-engine.js \
            app/v11/material-engine.js \
            app/v11/storage-engine.js \
            app/v11_1/service-worker.js \
            app/v10/shape-engine.js \
            app/v10/ocr-engine.js; do
            node --check "$f"
          done

      - name: Run measurement trust smoke tests
        run: node tests/web-measurement-smoke.mjs

      - name: Verify V11.1 release contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'TABELA AI V11.1' app/v11_1/index.html
          grep -q 'UNIVERSAL FIELD 11.1.1' app/v11_1/index.html
          grep -q "serviceWorker.register('./service-worker.js?b=11.1.1'" app/v11_1/index.html
          grep -q 'app/v11_1' index.html
          grep -q '11.1.1' app/v11_1/manifest.webmanifest
          grep -q 'tabela-ai-v11-1-11.1.1' app/v11_1/service-worker.js
          grep -q '11.1-independent-verify' app/v11/ocr-ensemble.js
          grep -q 'native+web-independent' app/v11/ocr-ensemble.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
