name: Build Signed TABELA AI Android

on:
  workflow_dispatch:

jobs:
  signed-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Android signing credentials
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Actions secret: $key" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/tabela-ai-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"

      - name: Run unit tests and lint
        run: |
          gradle -p native/android/TabelaAIMobile :app:testDebugUnitTest --stacktrace
          gradle -p native/android/TabelaAIMobile :app:lintRelease --stacktrace

      - name: Build signed release APK and AAB
        run: |
          gradle -p native/android/TabelaAIMobile :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signed APK and package release
        shell: bash
        run: |
          set -euo pipefail
          APK="native/android/TabelaAIMobile/app/build/outputs/apk/release/app-release.apk"
          AAB="native/android/TabelaAIMobile/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          mkdir -p dist/mobile/android-signed
          cp "$APK" dist/mobile/android-signed/TabelaAI-Android-11.1.1-release.apk
          cp "$AAB" dist/mobile/android-signed/TabelaAI-Android-11.1.1-release.aab
          (cd dist/mobile/android-signed && sha256sum TabelaAI-Android-11.1.1-release.apk TabelaAI-Android-11.1.1-release.aab > SHA256SUMS.txt)
          (cd dist/mobile/android-signed && sha256sum -c SHA256SUMS.txt)

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: tabela-ai-android-signed-11-1-1
          path: |
            dist/mobile/android-signed/TabelaAI-Android-11.1.1-release.apk
            dist/mobile/android-signed/TabelaAI-Android-11.1.1-release.aab
            dist/mobile/android-signed/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
