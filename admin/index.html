<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABELA AI Yönetim Paneli</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#08111e;color:#eef5ff;font-family:system-ui}main{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900}.muted{color:#91a5bf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}.card{background:#101b2e;border:1px solid #263852;border-radius:18px;padding:16px}.big{font-size:28px;font-weight:900}input,button{font:inherit;border-radius:10px;border:1px solid #2b405e;background:#091424;color:#fff;padding:10px 12px}button{font-weight:800;background:#223653}.row{display:flex;gap:8px;flex-wrap:wrap}#map{height:430px;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #263852}th{color:#9eb0c8}.scroll{overflow:auto}.ok{color:#70efbb}.warn{color:#ffdc72}</style></head><body><main><div class="top"><div><div class="brand">TABELA AI • Yönetim</div><div class="muted">V10 saha kayıtları, harita ve rapor</div></div><div class="row"><input id="api" placeholder="Backend API (opsiyonel)"><button id="load">Yenile</button><button id="csv">CSV</button></div></div><div class="grid"><div class="card"><div class="muted">Toplam</div><div id="count" class="big">0</div></div><div class="card"><div class="muted">Doğrulanmış ölçüm</div><div id="verified" class="big">0</div></div><div class="card"><div class="muted">Toplam alan</div><div id="area" class="big">0 m²</div></div><div class="card"><div class="muted">Kontrol gereken OCR</div><div id="ocrReview" class="big">0</div></div></div><div class="card"><h2>Harita</h2><div id="map"></div></div><div class="card"><div class="row"><input id="q" placeholder="Ara: firma, proje, tip, OCR" style="flex:1"><button id="search">Ara</button></div><div class="scroll" style="margin-top:12px"><table><thead><tr><th>ID</th><th>OCR</th><th>Şekil</th><th>Tür</th><th>Proje</th><th>Alan</th><th>Ölçüm</th><th>GPS</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
let records=[],map=L.map('map').setView([41,29],10),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('api').value=localStorage.getItem('tabela_ai_admin_api')||'';
async function load(){const api=$('api').value.trim();localStorage.setItem('tabela_ai_admin_api',api);if(api){try{const r=await fetch(api.replace(/\/$/,'')+'/api/signs');if(!r.ok)throw 0;records=(await r.json()).signs||[]}catch{alert('Backend okunamadı; yerel kayıtlar gösteriliyor.');records=JSON.parse(localStorage.getItem('tabela_ai_v10_records')||'[]')}}else records=JSON.parse(localStorage.getItem('tabela_ai_v10_records')||'[]');render()}
function render(){const q=$('q').value.toLowerCase(),a=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=records.length;$('verified').textContent=records.filter(r=>r.measurementVerified).length;$('area').textContent=records.reduce((s,r)=>s+(Number(r.areaM2)||0),0).toFixed(2)+' m²';$('ocrReview').textContent=records.filter(r=>!r.ocrValidated).length;$('rows').innerHTML=a.slice().reverse().map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.ocr)}</td><td>${esc(r.shapeLabel)}</td><td>${esc(r.signType)}</td><td>${esc(r.project)}</td><td>${r.areaM2?Number(r.areaM2).toFixed(2)+' m²':'—'}</td><td class="${r.measurementVerified?'ok':'warn'}">${r.measurementVerified?'Doğrulandı':'Bekliyor'}</td><td>${r.gps?.lat?Number(r.gps.lat).toFixed(5)+', '+Number(r.gps.lng).toFixed(5):'—'}</td></tr>`).join('');layer.clearLayers();const pts=[];for(const r of records){if(Number.isFinite(r.gps?.lat)){const p=[r.gps.lat,r.gps.lng];pts.push(p);L.marker(p).bindPopup(`<b>${esc(r.ocr||r.id)}</b><br>${esc(r.signType)}<br>${r.areaM2?Number(r.areaM2).toFixed(2)+' m²':'Ölçüm yok'}`).addTo(layer)}}if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.2));setTimeout(()=>map.invalidateSize(),100)}
function csv(){const cols=['id','createdAt','project','signType','shapeLabel','ocr','ocrConfidence','panel','lettering','measurementVerified','widthM','heightM','areaM2','distanceM'];const e=v=>'"'+String(v??'').replaceAll('"','""')+'"',s='\ufeff'+[cols.join(','),...records.map(r=>cols.map(k=>e(r[k])).join(','))].join('\n'),b=new Blob([s],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tabela_ai_yonetim.csv';a.click();URL.revokeObjectURL(u)}$('load').onclick=load;$('search').onclick=render;$('q').oninput=render;$('csv').onclick=csv;load();</script></body></html>
