<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TABELA AI Yönetim V11</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#08111e;color:#eef5ff;font-family:system-ui}main{max-width:1250px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:30px;font-weight:900}.muted{color:#91a5bf}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}.card{background:#101b2e;border:1px solid #263852;border-radius:18px;padding:16px}.big{font-size:27px;font-weight:900}input,button{font:inherit;border-radius:10px;border:1px solid #2b405e;background:#091424;color:#fff;padding:10px 12px}button{font-weight:800;background:#223653}.row{display:flex;gap:8px;flex-wrap:wrap}#map{height:440px;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #263852;white-space:nowrap}th{color:#9eb0c8}.scroll{overflow:auto}.ok{color:#70efbb}.warn{color:#ffdc72}.bad{color:#ff9bac}</style></head><body><main><div class="top"><div><div class="brand">TABELA AI • Yönetim V11</div><div class="muted">Kalite, OCR, LiDAR/AR, adres, yön ve audit odaklı saha yönetimi</div></div><div class="row"><input id="api" placeholder="Backend API"><input id="token" placeholder="Bearer token"><button id="load">Yenile</button><button id="csv">CSV</button></div></div><div class="grid"><div class="card"><div class="muted">Toplam</div><div id="count" class="big">0</div></div><div class="card"><div class="muted">Ölçüm doğrulandı</div><div id="verified" class="big">0</div></div><div class="card"><div class="muted">Toplam alan</div><div id="area" class="big">0 m²</div></div><div class="card"><div class="muted">OCR kontrol</div><div id="ocrReview" class="big">0</div></div><div class="card"><div class="muted">Kalite <75</div><div id="qualityReview" class="big">0</div></div></div><div class="card"><h2>Harita</h2><div id="map"></div></div><div class="card"><div class="row"><input id="q" placeholder="Ara: OCR, proje, adres, tip" style="flex:1"><button id="search">Ara</button></div><div class="scroll" style="margin-top:12px"><table><thead><tr><th>ID</th><th>OCR</th><th>Kalite</th><th>Şekil</th><th>Proje</th><th>Adres</th><th>Yön</th><th>Alan</th><th>Ölçüm</th><th>Kaynak</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script>
let records=[],map=L.map('map').setView([41,29],10),layer=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'}).addTo(map);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('api').value=localStorage.getItem('tabela_ai_admin_api_v11')||'';$('token').value=localStorage.getItem('tabela_ai_admin_token_v11')||'';
async function localRecords(){return new Promise((ok,fail)=>{const r=indexedDB.open('tabela_ai_v11',1);r.onerror=()=>ok([]);r.onupgradeneeded=()=>{};r.onsuccess=()=>{const d=r.result;if(!d.objectStoreNames.contains('records'))return ok([]);const q=d.transaction('records','readonly').objectStore('records').getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>ok([])}})}
async function load(){const api=$('api').value.trim().replace(/\/$/,''),token=$('token').value.trim();localStorage.setItem('tabela_ai_admin_api_v11',api);localStorage.setItem('tabela_ai_admin_token_v11',token);if(api){try{const r=await fetch(api+'/api/signs',{headers:token?{authorization:'Bearer '+token}:{}});if(!r.ok)throw new Error(String(r.status));records=(await r.json()).signs||[]}catch(e){alert('Backend okunamadı; bu cihazdaki V11 kayıtları gösteriliyor.');records=await localRecords()}}else records=await localRecords();render()}
function render(){const q=$('q').value.toLowerCase(),a=records.filter(r=>JSON.stringify(r).toLowerCase().includes(q));$('count').textContent=records.length;$('verified').textContent=records.filter(r=>r.measurementVerified).length;$('area').textContent=records.reduce((s,r)=>s+(Number(r.areaM2)||0),0).toFixed(2)+' m²';$('ocrReview').textContent=records.filter(r=>!r.ocrValidated).length;$('qualityReview').textContent=records.filter(r=>(Number(r.qualityScore)||0)<75).length;$('rows').innerHTML=a.slice().reverse().map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.ocr)}</td><td class="${(r.qualityScore||0)>=75?'ok':'warn'}">%${r.qualityScore||0}</td><td>${esc(r.shapeLabel)}</td><td>${esc(r.project)}</td><td>${esc(r.address?.road||r.address?.city||'—')}</td><td>${Number.isFinite(r.orientation?.heading)?Math.round(r.orientation.heading)+'°':'—'}</td><td>${r.areaM2?Number(r.areaM2).toFixed(2)+' m²':'—'}</td><td class="${r.measurementVerified?'ok':'warn'}">${r.measurementVerified?'Doğrulandı':'Bekliyor'}</td><td>${esc(r.measurementSource||'—')}</td></tr>`).join('');layer.clearLayers();const pts=[];for(const r of records){if(Number.isFinite(r.gps?.lat)){const p=[r.gps.lat,r.gps.lng];pts.push(p);L.marker(p).bindPopup(`<b>${esc(r.ocr||r.id)}</b><br>${esc(r.address?.road||'')}<br>${r.areaM2?Number(r.areaM2).toFixed(2)+' m²':'Ölçüm yok'}<br>${esc(r.measurementSource||'')}`).addTo(layer)}}if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(.2));setTimeout(()=>map.invalidateSize(),100)}
function csv(){const cols=['id','createdAt','project','signType','shapeLabel','ocr','ocrConfidence','ocrValidated','qualityScore','panel','lettering','measurementVerified','measurementSource','measurementQualityScore','widthM','heightM','areaM2','distanceM'];const e=v=>'"'+String(v??'').replaceAll('"','""')+'"',s='\ufeff'+[cols.join(','),...records.map(r=>cols.map(k=>e(r[k])).join(','))].join('\n'),b=new Blob([s],{type:'text/csv'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='tabela_ai_v11_yonetim.csv';a.click();URL.revokeObjectURL(u)}$('load').onclick=load;$('search').onclick=render;$('q').oninput=render;$('csv').onclick=csv;load();
</script></body></html>
